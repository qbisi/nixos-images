name: Build packages

on:
  push:
    branches:
      - master
      - stage
  pull_request:
    branches:
      - master
      - stage

concurrency:
  group: build-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare package matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Collect packages
        id: packages
        run: |
          packages="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
              in
              builtins.attrNames flake.packages.aarch64-linux
            '
          )"

          if [ "$packages" = "[]" ]; then
            echo "::error::packages.aarch64-linux does not contain any packages."
            exit 1
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    runs-on: ubuntu-24.04-arm
    environment: cachix
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ github.token }}

      - name: Check Cachix configuration
        if: github.event_name == 'push'
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_CACHE_NAME" || {
            echo "::error::Set the CACHIX_CACHE_NAME environment variable."
            exit 1
          }
          test -n "$CACHIX_AUTH_TOKEN" || {
            echo "::error::Set the CACHIX_AUTH_TOKEN environment secret."
            exit 1
          }

      - name: Configure Cachix
        if: github.event_name == 'push'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build package
        run: nix build --no-link --print-build-logs ".#${{ matrix.package }}"
